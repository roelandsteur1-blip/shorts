# Footage collector research, step R1: the fixed test set. 60 subjects, 6 per niche, from easy
# (Apollo 11) to hard (red blood cell). Every research step runs on exactly these, so old and new
# can be compared. Do not change a subject once results exist; add a new file for a new set.
#
# name: as a person says it (also the search text). wikidata: the label to look up, hint: a word
# the right Wikidata description contains (the first of the top 5 matches that has it is used;
# Wikidata's own top match is wrong for about 1 in 5 names). show: what a good shot must show.

