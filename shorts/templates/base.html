<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Shorts{% endblock %} · Shorts dashboard</title>
<style>
:root{--bg:#0f1115;--card:#181b22;--line:#2a2f3a;--text:#e8eaf0;--muted:#9aa3b2;--ok:#3fb950;--warn:#d29922;--bad:#f85149;--accent:#58a6ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,sans-serif}
a{color:var(--accent)}main{max-width:1200px;margin:0 auto;padding:16px}
nav{display:flex;flex-wrap:wrap;gap:4px 16px;padding:10px 0 14px;border-bottom:1px solid var(--line);margin-bottom:8px}
nav a{text-decoration:none}nav a.on{color:var(--text);font-weight:600}
.card{background:var(--card);border-radius:10px;padding:14px;margin:10px 0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.grid{display:grid;grid-template-columns:380px 1fr;gap:20px}@media(max-width:800px){.grid{grid-template-columns:1fr}}
video{width:100%;max-height:70vh;border-radius:10px;background:#000}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.muted{color:var(--muted)}
input[type=text],input[type=number],input[type=password],textarea,select{width:100%;background:#0b0d11;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:8px;font:inherit}
label{display:block;margin:8px 0}
button,.button{display:inline-block;border:0;border-radius:8px;padding:9px 16px;font-weight:600;cursor:pointer;background:#2a2f3a;color:var(--text);text-decoration:none;font-size:14px}
.approve,.primary{background:var(--ok);color:#000}.reject,.danger{background:var(--bad);color:#fff}
table{width:100%;border-collapse:collapse}td,th{padding:6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.bar{height:8px;background:#0b0d11;border-radius:4px;overflow:hidden}.bar>div{height:100%;background:var(--accent)}
pre.log{background:#0b0d11;border-radius:8px;padding:10px;max-height:420px;overflow:auto;white-space:pre-wrap;font-size:12px}
.stat{display:inline-block;margin:0 14px 6px 0}.stat b{font-size:20px;display:block}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.thumbs img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:6px;background:#000}
.pill{display:inline-block;border:1px solid var(--line);border-radius:12px;padding:1px 8px;font-size:12px;margin:2px}
form.inline{display:inline}
.speed button{padding:3px 10px;font-size:13px;border-radius:0}.speed button:first-of-type{border-radius:8px 0 0 8px}.speed button:last-of-type{border-radius:0 8px 8px 0}
.speed button.on{background:var(--accent);color:#000}
kbd{border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:12px}
</style></head><body><main>
{% set here = request.path %}
<nav>
<a href="/" class="{{ 'on' if here == '/' }}">Home</a>
<a href="/make" class="{{ 'on' if here.startswith('/make') }}">Make</a>
<a href="/review" class="{{ 'on' if here.startswith('/review') or here.startswith('/short') }}">Review</a>
<a href="/schedule" class="{{ 'on' if here.startswith('/schedule') }}">Schedule</a>
<a href="/library" class="{{ 'on' if here.startswith('/library') }}">Library</a>
<a href="/sources" class="{{ 'on' if here.startswith('/sources') }}">Sources</a>
<a href="/music" class="{{ 'on' if here.startswith('/music') }}">Music</a>
<a href="/stats" class="{{ 'on' if here.startswith('/stats') }}">Stats</a>
<a href="/jobs" class="{{ 'on' if here.startswith('/jobs') }}">Jobs</a>
<form method="post" action="/speed" class="inline speed" style="margin-left:auto" title="Quiet: about half the CPU, one render at a time, cooler and quieter. Fast: everything the laptop has. Jobs always run at low priority.">
<span class="muted" style="font-size:13px">Speed{% if on_battery %} (on battery: Quiet){% endif %}</span>
<button name="mode" value="quiet" class="{{ 'on' if speed_mode == 'quiet' }}">Quiet</button><button name="mode" value="fast" class="{{ 'on' if speed_mode == 'fast' }}">Fast</button></form>
</nav>
{% block body %}{% endblock %}
</main></body></html>
