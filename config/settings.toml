# Global settings. Override any value in config/local.toml (not committed).

# Media, database and renders live here (setup.sh sets it in local.toml: ~/shorts-data).
data_dir = "C:/shorts-data"

# Downloaded videos (the big part) can live elsewhere. Default: <data_dir>/footage.
# footage_dir = "/mnt/footage"

# Downloads stop when the footage drive has less free space than this (GB).
min_free_gb = 20

# 'make' downloads new footage by itself when the library can make fewer Shorts than this,
# restock_per_term videos per channel search term.
restock_below = 15
restock_per_term = 2

# Long videos give more than one Short: one per segment_seconds of video, at most
# max_shorts_per_video. Their hero shots lie at least segment_seconds apart, and Shorts from
# the same video are published at least sibling_gap_days apart.
segment_seconds = 90
max_shorts_per_video = 5
sibling_gap_days = 2

# Command used to call Claude Code headless (uses your Claude subscription).
claude_cmd = "claude"

# Render encoding speed (libx264). YouTube re-encodes every upload, so "veryfast" looks the same
# after upload as "medium" (the old setting) in a fraction of the time.
x264_preset = "veryfast"

# Cutting videos into scenes: "fast" reads each video once with ffmpeg, small frames, long videos
# split over several workers. "pyscenedetect" is the old, slower way.
scene_detector = "fast"
scene_fps = 10

# Image/text embedding model (runs locally, no Claude usage).
clip_model = "ViT-B-32"
clip_pretrained = "laion2b_s34b_b79k"

# Default channel used when --channel is not given.
default_channel = "space"

# YouTube uploads per day for the Google Cloud project; all channels share it.
upload_quota = 100

# Uploads per channel per 24 hours. YouTube has its own per-channel daily limit (lower for new or
# unverified channels); going over it fails with uploadLimitExceeded. The rest stay approved and
# go up on the next run. Publishing stays at the channel's uploads_per_day / publish_times_utc.
channel_uploads_per_day = 5

# Background music (Music page). 'make' downloads CC0 / public-domain music from Openverse (and
# Freesound once its free key is saved) when a channel has fewer usable tracks than this. 0 = never;
# then only the files you put in data_dir/music/<channel> are used.
music_min_tracks = 30

# Tags, 3 layers of 3 (shorts/tags.py): 3 about the Short itself (written with the script), 3 for the
# channel's niche (channel settings), and these 3 broad ones on every Short.
broad_tags = ["shorts", "viral shorts", "for you"]
