# Global settings. Override any value in config/local.toml (not committed).

# Media, database and renders live here, OUTSIDE OneDrive.
data_dir = "C:/shorts-data"

# Downloaded videos (the big part) can live on another drive, e.g. footage_dir = "D:/shorts-footage".
# Default: <data_dir>/footage. After changing it, run 'python -m shorts move-footage' once.
# footage_dir = "D:/shorts-footage"

# Downloads stop when the footage drive has less free space than this (GB).
min_free_gb = 20

# 'make' downloads new footage by itself when the library can make fewer Shorts than this,
# restock_per_term videos per channel search term.
restock_below = 15
restock_per_term = 2

# Long videos give more than one Short: one per segment_seconds of video, at most
# max_shorts_per_video. Their hero shots lie at least segment_seconds apart, and Shorts from
# the same video are published at least sibling_gap_days apart.
segment_seconds = 90
max_shorts_per_video = 5
sibling_gap_days = 2

# Command used to call Claude Code headless (uses your Claude subscription).
claude_cmd = "claude"

# Video encoder: "auto" tries h264_nvenc (RTX GPU) and falls back to libx264.
encoder = "auto"
# CPU encoding speed when the GPU encoder can't be used. YouTube re-encodes every upload, so
# "veryfast" looks the same after upload as "medium" (the old setting) in a fraction of the time.
x264_preset = "veryfast"

# Cutting videos into scenes: "fast" reads each video once with ffmpeg (on the GPU when the
# driver allows), small frames, long videos split over several workers. "pyscenedetect" is the
# old, slower way; 'python -m shorts bench --scenes' compares both on your own footage.
scene_detector = "fast"
scene_fps = 10

# How much of the laptop the pipeline uses is switched by hand on the dashboard (Quiet / Fast).

# Image/text embedding model (runs locally on the GPU).
clip_model = "ViT-B-32"
clip_pretrained = "laion2b_s34b_b79k"

# Default channel used when --channel is not given.
default_channel = "space"

# YouTube uploads per day for the Google Cloud project; all channels share it.
upload_quota = 100

# Uploads per channel per 24 hours. YouTube has its own per-channel daily limit (lower for new or
# unverified channels); going over it fails with uploadLimitExceeded. The rest stay approved and
# go up on the next run. Publishing stays at the channel's uploads_per_day / publish_times_utc.
channel_uploads_per_day = 5
