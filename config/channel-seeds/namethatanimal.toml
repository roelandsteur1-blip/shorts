# New channel (video type: quiz). Copied once into config/channels by the dashboard
# (shorts/channels.py seed_channels); edit it there, on its Settings page.
id = "namethatanimal"
name = "Name That Animal"
language = "en"
niche = "animal quizzes: guess the wild animal from the clip in 3 levels"
video_type = "quiz"
categories = []
sources = ["nasa"]
search_terms = []
min_seconds = 6
max_seconds = 30
uploads_per_day = 1
publish_times_utc = ["19:00"]
niche_tags = ["animal quiz", "wildlife", "guess the animal"]
