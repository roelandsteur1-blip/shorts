# Footage categories. Mixed archives (Internet Archive, Prelinger, Library of Congress, Commons, ...)
# are sorted into these per scene; a channel picks categories in its own TOML (categories = [...]).
#
#   keywords      matched against the archive's own title, subjects and description (step 1)
#   clip_prompts  what the category looks like, for the local CLIP check on each scene (step 2)
#   search        per-source search hints used when restocking this category (a string or a list)
#
# Add one here or on the dashboard's Library page ("Draft with Claude" fills these fields).

[[category]]
id = "space"
label = "Space"
keywords = ["space", "rocket", "launch", "astronaut", "spacewalk", "satellite", "orbit", "nasa", "planet",
            "moon", "mars", "jupiter", "saturn", "galaxy", "nebula", "telescope", "space station", "apollo",
            "space shuttle", "spacecraft", "astronomy", "solar system", "comet"]
clip_prompts = ["a rocket launching into the sky", "an astronaut in a spacesuit", "a planet seen from space",
                "stars and a galaxy in deep space", "the earth seen from orbit"]
[category.search]
nasa = ["rocket launch", "space station", "spacewalk", "Mars rover", "Jupiter", "Saturn", "solar flare",
        "earth from space", "moon landing", "galaxy", "nebula", "Artemis", "aurora from space"]
internet_archive = "subject:(space OR rocket OR astronaut OR nasa)"
prelinger = "subject:(space OR rocket OR missile OR satellite)"
commons = "rocket launch"
europeana = "space rocket"

